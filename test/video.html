<div class="video-container">
  <video id="myVideo" width="600" poster="poster.jpg">
    <source src="video.mp4" type="video/mp4">
    您的浏览器不支持 HTML5 视频。
  </video>
  
  <!-- 自定义控件栏 -->
  <div class="custom-controls">
    <!-- 播放/暂停按钮（使用表情） -->
    <button id="playPauseBtn" class="control-btn">▶️</button>
    
    <!-- 进度条 -->
    <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1">
    
    <!-- 时间显示 -->
    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
    
    <!-- 音量按钮（表情切换） -->
    <button id="volumeBtn" class="control-btn">🔊</button>
    <input type="range" id="volumeBar" value="100" min="0" max="100" step="1">
  </div>
</div>
